name: vsm-training
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vsm}
      POSTGRES_USER: ${POSTGRES_USER:-vsm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 10

  bootstrap:
    build: ./backend
    command:
      - sh
      - -ec
      - |
        alembic upgrade head
        python -m app.scenarios import /scenarios/demo
        python -m app.scenarios import /scenarios/shifts
        python -m app.retention_seed
    volumes:
      - ./scenarios:/scenarios:ro
    environment:
      PGHOST: db
      PGDATABASE: ${POSTGRES_DB:-vsm}
      PGUSER: ${POSTGRES_USER:-vsm}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      DATABASE_URL: postgresql+psycopg:///
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    build: ./backend
    volumes:
      - ./scenarios:/scenarios:ro
    environment:
      PGHOST: db
      PGDATABASE: ${POSTGRES_DB:-vsm}
      PGUSER: ${POSTGRES_USER:-vsm}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      DATABASE_URL: postgresql+psycopg:///
      DEMO_AUTH_ENABLED: ${DEMO_AUTH_ENABLED:-false}
      RATE_LIMIT_AUTH_PER_MINUTE: ${RATE_LIMIT_AUTH_PER_MINUTE:-120}
      RATE_LIMIT_START_PER_MINUTE: ${RATE_LIMIT_START_PER_MINUTE:-60}
      RATE_LIMIT_DECISION_PER_MINUTE: ${RATE_LIMIT_DECISION_PER_MINUTE:-240}
      RATE_LIMIT_SHIFT_START_PER_MINUTE: ${RATE_LIMIT_SHIFT_START_PER_MINUTE:-30}
      RATE_LIMIT_SHIFT_ADVANCE_PER_MINUTE: ${RATE_LIMIT_SHIFT_ADVANCE_PER_MINUTE:-120}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=4)",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  timer-worker:
    build: ./backend
    command: ["python", "-m", "app.worker"]
    environment:
      PGHOST: db
      PGDATABASE: ${POSTGRES_DB:-vsm}
      PGUSER: ${POSTGRES_USER:-vsm}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      DATABASE_URL: postgresql+psycopg:///
      TIMER_POLL_SECONDS: ${TIMER_POLL_SECONDS:-1}
    depends_on:
      db:
        condition: service_healthy
      bootstrap:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
